# ============================================================
# Agent + Redis — chạy bằng một lệnh:  docker compose up --build
#   cp .env.example .env   (đặt AGENT_API_KEY của bạn; không có .env vẫn khởi động được)
# ============================================================
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false          # không có file .env vẫn chạy được
    environment:
      # Trong Compose, Redis là service "redis" (đè lên REDIS_URL trong .env)
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
