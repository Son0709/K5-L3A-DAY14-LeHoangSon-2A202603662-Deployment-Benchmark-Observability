# Render Blueprint — New → Blueprint → chọn repo, Render đọc file này.
# Lưu ý: file này nằm trong thư mục con 06-lab-complete/ (Render mặc định tìm ở gốc repo),
# nên khi tạo Blueprint phải chỉ đúng đường dẫn: 06-lab-complete/render.yaml.
# dockerfilePath và dockerContext tính từ GỐC REPO. Gốc repo có một Dockerfile khác
# (ví dụ Go), nên phải ghi rõ đường dẫn tới Dockerfile của agent để không build nhầm.
services:
  - type: web
    name: day14-agent
    runtime: docker
    dockerfilePath: ./06-lab-complete/Dockerfile
    dockerContext: ./06-lab-complete
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true          # Render sinh chuỗi ngẫu nhiên, không ghi giá trị vào repo
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"

  # Redis của Render (Key Value). ipAllowList rỗng = chỉ dịch vụ nội bộ trong cùng workspace truy cập được.
  - type: keyvalue
    name: day14-redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
