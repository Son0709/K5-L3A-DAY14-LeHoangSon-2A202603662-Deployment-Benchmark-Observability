# Render Blueprint — New → Blueprint → chọn repo, Render đọc file này.
# Lưu ý: render.yaml nằm trong thư mục con 06-lab-complete/, nên khi tạo Blueprint
# hãy chỉ đúng đường dẫn file hoặc đặt Root Directory = 06-lab-complete.
services:
  - type: web
    name: day14-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true          # Render sinh chuỗi ngẫu nhiên, không ghi giá trị vào repo
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"

  # Redis của Render (Key Value). ipAllowList rỗng = chỉ dịch vụ nội bộ trong cùng workspace truy cập được.
  - type: keyvalue
    name: day14-redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
